<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>STORYTELLER.VTG · หลังร้าน</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="face.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Courier+Prime:wght@400;700&family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
/* Rack styles are scoped so the original back office keeps its styling. */
.vtg-rack{margin:24px 0 40px;background:#f2f1eb;color:#262822;border:1px solid #d9dad1;border-radius:18px;overflow:hidden;font-family:Sarabun,sans-serif}.rack-heading{padding:32px 36px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.rack-kicker{font:11px/1.5 'Courier Prime',monospace;letter-spacing:2px;color:#707367}.rack-heading h1{font:500 34px/1.3 Mitr,sans-serif;margin:8px 0}.rack-heading p:not(.rack-kicker){color:#707367;font-size:14px}.rack-count{white-space:nowrap;border:1px solid #c5c8bd;border-radius:24px;padding:8px 14px;font-size:12px}.rack-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding:0 24px}.rack-stage{position:relative;height:390px;min-width:680px;max-width:1120px;margin:0 auto;perspective:1100px;isolation:isolate}.rack-rail{position:absolute;top:54px;left:3%;right:3%;height:8px;background:linear-gradient(#e6e8df,#a4a89d 45%,#c4c8bb 65%,#eceee7);border-radius:8px;box-shadow:0 3px 6px #2222}.rack-rail:before,.rack-rail:after{content:'';position:absolute;top:-10px;width:8px;height:27px;background:#b4b9aa;border-radius:4px}.rack-rail:before{left:0}.rack-rail:after{right:0}.rack-shirt{position:absolute;top:53px;left:calc(5% + var(--slot) * (90% / var(--rack-count)));width:calc(90% / var(--rack-count));height:295px;margin:0;padding:0;border:0;background:none;color:inherit;cursor:pointer;transform-origin:50% 0;transform:rotateY(-48deg) rotate(var(--tilt));transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .4s;z-index:1;overflow:visible;-webkit-tap-highlight-color:transparent}.rack-photo{display:block;position:absolute;top:0;left:-55%;width:210%;height:275px}.rack-photo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(6px 14px 7px #26282225);user-select:none}.rack-tag{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font:11px 'Courier Prime',monospace;white-space:nowrap;opacity:0;transition:opacity .3s;background:#f2f1ebd9;padding:5px 9px;border-radius:4px}.rack-shirt:hover,.rack-shirt:focus-visible,.rack-shirt.is-selected{transform:translateZ(90px) rotateY(0) rotate(0) scale(1.08);z-index:5}.rack-shirt:focus-visible{outline:2px solid #5d714c;outline-offset:8px;border-radius:8px}.rack-shirt.is-selected .rack-tag,.rack-shirt:hover .rack-tag,.rack-shirt:focus-visible .rack-tag{opacity:1}.rack-selection{margin:0 36px;padding:22px 0;border-top:1px solid #d3d6ca;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:110px}.rack-selection h2{margin:6px 0;font-size:22px;font-weight:500}.rack-selection p{margin:0;color:#686d5f;font-size:14px}.rack-actions{display:flex;gap:8px;flex-wrap:wrap}.rack-button{border:1px solid #b9c0af;background:transparent;color:#343c2e;padding:11px 17px;border-radius:24px;font:14px Sarabun,sans-serif;cursor:pointer}.rack-button:focus-visible{outline:2px solid #4b623d;outline-offset:3px}.rack-primary{background:#343f2e;color:#fff;border-color:#343f2e}.rack-help{text-align:center;color:#767c6c;font-size:12px;padding:0 20px 20px}.rack-empty{text-align:center;padding:80px 24px;color:#707367}.rack-photo-error{position:absolute;inset:30% 20%;padding:12px;background:#e2e4db;color:#666;font-size:13px}.rack-photo-error[hidden]{display:none}@media(max-width:640px){.rack-heading{padding:24px 20px 0}.rack-heading h1{font-size:27px}.rack-stage{height:350px}.rack-shirt{height:260px}.rack-photo{height:245px}.rack-selection{margin:0 20px;align-items:flex-start;flex-direction:column}.rack-actions{width:100%}.rack-help{text-align:left}.rack-scroll{padding:0 16px}}@media(prefers-reduced-motion:reduce){.rack-shirt,.rack-tag{transition:none}}

  </style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="authView" class="auth">
  <div class="auth-inner">
    <figure class="auth-logo">
      <img src="logo.jpg" alt="โลโก้ร้าน STORYTELLER.VTG">
    </figure>
    <div class="auth-card">
      <p class="eyebrow">Staff only · หลังร้าน</p>
      <h1 class="wordmark">Storyteller<span>.vtg</span></h1>

      <form id="loginForm" class="stack" novalidate>
        <div class="field">
          <label for="loginEmail">อีเมล</label>
          <input id="loginEmail" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">รหัสผ่าน</label>
          <input id="loginPass" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn primary block" type="submit" id="loginBtn">เข้าสู่หลังร้าน</button>
        <button class="linkbtn" type="button" id="forgotBtn">ลืมรหัสผ่าน?</button>
      </form>

      <form id="resetForm" class="stack" novalidate hidden>
        <p class="muted">ใส่อีเมลของคุณ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้</p>
        <div class="field">
          <label for="resetEmail">อีเมล</label>
          <input id="resetEmail" type="email" autocomplete="username" required>
        </div>
        <button class="btn primary block" type="submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
        <button class="linkbtn" type="button" id="backToLogin">กลับไปหน้าเข้าสู่ระบบ</button>
      </form>

      <form id="newPassForm" class="stack" novalidate hidden>
        <p class="muted">ตั้งรหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</p>
        <div class="field">
          <label for="newPass">รหัสผ่านใหม่</label>
          <input id="newPass" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn primary block" type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>

      <p class="auth-msg" id="authMsg" role="status"></p>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="appView" hidden>
  <header class="masthead">
    <div class="wrap mast-row">
      <a class="brand" href="#" aria-label="STORYTELLER.VTG">
        <img src="face.png" alt="">
        <span class="wordmark">Storyteller<span>.vtg</span></span>
      </a>
      <div class="mast-actions">
        <span class="who" id="whoAmI"></span>
        <button class="btn ghost small" type="button" id="logoutBtn">ออกจากระบบ</button>
        <button class="btn orange" type="button" id="addBtn">+ เพิ่มเสื้อ</button>
      </div>
    </div>
    <nav class="wrap tabs" role="tablist" id="tabs">
      <button role="tab" data-v="rack" aria-selected="true">ราวเสื้อ</button>
      <button role="tab" data-v="dash" aria-selected="false">ภาพรวม</button>
      <button role="tab" data-v="stock" aria-selected="false">สต็อก <b id="cStock"></b></button>
      <button role="tab" data-v="sold" aria-selected="false">ขายแล้ว <b id="cSold"></b></button>
      <button role="tab" data-v="all" aria-selected="false">ทั้งหมด <b id="cAll"></b></button>
    </nav>
  </header>

  <div class="wrap">
    <div class="filters">
      <div class="toolbar" id="toolbar">
        <input type="search" id="q" placeholder="ค้นหา ชื่อ, รหัส, Tag, Style…" aria-label="ค้นหา">
        <select id="sort" aria-label="เรียงลำดับ">
          <option value="new">ซื้อล่าสุดก่อน</option>
          <option value="old">ค้างสต็อกนานสุดก่อน</option>
          <option value="costHi">ทุนสูง → ต่ำ</option>
          <option value="cond">สภาพดีสุดก่อน</option>
          <option value="profit">กำไรมากสุดก่อน</option>
        </select>
      </div>
      <div class="labels" id="labelBar" aria-label="กรองตามป้ายกำกับ"></div>
    </div>
    <main id="main"></main>
  </div>
  <footer class="wrap foot">STORYTELLER.VTG · back office</footer>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // ถ้าไฟล์ไหนโหลดไม่ขึ้น ให้แจ้งบนหน้าเว็บแทนที่จะเป็นหน้าขาว
  (function () {
    var miss = [];
    if (!window.supabase) miss.push("ไลบรารี Supabase (อินเทอร์เน็ต/ตัวบล็อกโฆษณา)");
    if (!window.STORYTELLER_CONFIG) miss.push("config.js");
    if (!window.STORYTELLER_APP_LOADED) miss.push("app.js");
    var cssOk = getComputedStyle(document.body).backgroundColor !== "rgba(0, 0, 0, 0)";
    if (!cssOk) miss.push("style.css");
    if (miss.length) {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:999;background:#fff3cd;color:#1d1a16;border:2px solid #1d1a16;border-radius:10px;padding:12px 14px;font:15px/1.5 sans-serif";
      d.textContent = "โหลดไฟล์เหล่านี้ไม่ได้: " + miss.join(", ") + " — เช็กใน GitHub ว่าไฟล์นี้อยู่ข้างๆ index.html และชื่อตรงกัน (ตัวพิมพ์เล็ก)";
      document.body.appendChild(d);
      document.getElementById("authView").hidden = false;
    }
  })();
</script>
</body>
</html>
