<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>STORYTELLER.VTG · หลังร้าน</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/face.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Courier+Prime:wght@400;700&family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="authView" class="auth" hidden>
  <div class="auth-inner">
    <figure class="auth-logo">
      <img src="assets/logo.jpg" alt="โลโก้ร้าน STORYTELLER.VTG">
    </figure>
    <div class="auth-card">
      <p class="eyebrow">Staff only · หลังร้าน</p>
      <h1 class="wordmark">Storyteller<span>.vtg</span></h1>

      <form id="loginForm" class="stack" novalidate>
        <div class="field">
          <label for="loginEmail">อีเมล</label>
          <input id="loginEmail" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">รหัสผ่าน</label>
          <input id="loginPass" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn primary block" type="submit" id="loginBtn">เข้าสู่หลังร้าน</button>
        <button class="linkbtn" type="button" id="forgotBtn">ลืมรหัสผ่าน?</button>
      </form>

      <form id="resetForm" class="stack" novalidate hidden>
        <p class="muted">ใส่อีเมลของคุณ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้</p>
        <div class="field">
          <label for="resetEmail">อีเมล</label>
          <input id="resetEmail" type="email" autocomplete="username" required>
        </div>
        <button class="btn primary block" type="submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
        <button class="linkbtn" type="button" id="backToLogin">กลับไปหน้าเข้าสู่ระบบ</button>
      </form>

      <form id="newPassForm" class="stack" novalidate hidden>
        <p class="muted">ตั้งรหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</p>
        <div class="field">
          <label for="newPass">รหัสผ่านใหม่</label>
          <input id="newPass" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn primary block" type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>

      <p class="auth-msg" id="authMsg" role="status"></p>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="appView" hidden>
  <header class="masthead">
    <div class="wrap mast-row">
      <a class="brand" href="#" aria-label="STORYTELLER.VTG">
        <img src="assets/face.png" alt="">
        <span class="wordmark">Storyteller<span>.vtg</span></span>
      </a>
      <div class="mast-actions">
        <span class="who" id="whoAmI"></span>
        <button class="btn ghost small" type="button" id="logoutBtn">ออกจากระบบ</button>
        <button class="btn orange" type="button" id="addBtn">+ เพิ่มเสื้อ</button>
      </div>
    </div>
    <nav class="wrap tabs" role="tablist" id="tabs">
      <button role="tab" data-v="dash" aria-selected="true">ภาพรวม</button>
      <button role="tab" data-v="stock" aria-selected="false">สต็อก <b id="cStock"></b></button>
      <button role="tab" data-v="sold" aria-selected="false">ขายแล้ว <b id="cSold"></b></button>
      <button role="tab" data-v="all" aria-selected="false">ทั้งหมด <b id="cAll"></b></button>
    </nav>
  </header>

  <div class="wrap">
    <div class="filters">
      <div class="toolbar" id="toolbar">
        <input type="search" id="q" placeholder="ค้นหา ชื่อ, รหัส, Tag, Style…" aria-label="ค้นหา">
        <select id="sort" aria-label="เรียงลำดับ">
          <option value="new">ซื้อล่าสุดก่อน</option>
          <option value="old">ค้างสต็อกนานสุดก่อน</option>
          <option value="costHi">ทุนสูง → ต่ำ</option>
          <option value="cond">สภาพดีสุดก่อน</option>
          <option value="profit">กำไรมากสุดก่อน</option>
        </select>
      </div>
      <div class="labels" id="labelBar" aria-label="กรองตามป้ายกำกับ"></div>
    </div>
    <main id="main"></main>
  </div>
  <footer class="wrap foot">STORYTELLER.VTG · back office</footer>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
